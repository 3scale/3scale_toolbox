---
version: 2.1

##################################### YAML ANCHORS  ############################################

tag-trigger: &tag-trigger
  tags:
    only: /^v.*/

only-main-filter: &only-main-filter
  filters:
    branches:
      only: main

commands:
  install-qlty:
    steps:
      - run:
          name: Install Qlty CLI
          command: |
            curl -sL https://qlty.sh | bash

  setup-bundler:
    steps:
      - run:
          name: setup bundler
          command: |
            sudo gem update --system
            sudo gem uninstall bundler
            sudo rm /usr/local/bin/bundle || true
            sudo rm /usr/local/bin/bundler || true
            sudo gem install bundler --version 2.3.5

  install_dependencies:
    steps:
      - restore_cache:
          keys:
            - v3-dependencies-{{ checksum "Gemfile.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v3-dependencies

      - run:
          name: Install dependencies
          command: |
            # required for the license_finder
            # The Gemfile.lock specifies nokogiri (1.14.0)
            # but bundler would install native gem instead if not forced
            bundle config set --local force_ruby_platform true
            bundle install --jobs=3 --retry=3 --path vendor/bundle

      - save_cache:
          key: v3-dependencies-{{ checksum "Gemfile.lock" }}
          paths:
            - ./vendor/bundle

  unittests:
    steps:
      - install_dependencies
      - run:
          name: Run unittests
          environment:
            COVERAGE: 1
          command: |
            bundle exec rake spec:unit

  setup-docker:
    steps:
      - setup_remote_docker:
          docker_layer_caching: true

jobs:
  ruby-30-unittest:
    docker:
      - image: cimg/ruby:3.0
    working_directory: ~/repo
    steps:
      - checkout
      - setup-bundler
      - unittests
      - install-qlty
      - run:
          name: Upload unit test coverage to Qlty
          command: |
            ~/.qlty/bin/qlty coverage publish --tag unit --incomplete coverage/.resultset.json

  license_check:
    docker:
      - image: cimg/ruby:3.0
    working_directory: ~/repo
    steps:
      - checkout
      - setup-bundler
      - install_dependencies
      - run:
          name: License check
          command: |
            bundle exec rake license_finder:check

  help_test:
    docker:
      - image: cimg/ruby:3.0
    working_directory: ~/repo
    steps:
      - checkout
      - setup-bundler
      - install_dependencies
      - run:
          name: Help test
          command: |
            bundle exec 3scale help

  integration_tests:
    docker:
      - image: cimg/ruby:3.0
    working_directory: ~/repo
    steps:
      - checkout
      - setup-bundler
      - install_dependencies
      - run:
          name: Integration Tests
          environment:
            COVERAGE: 1
          command: |
            bundle exec rake spec:integration
      - install-qlty
      - run:
          name: Upload integration test coverage to Qlty
          command: |
            ~/.qlty/bin/qlty coverage publish --tag integration --incomplete coverage/.resultset.json

  docker_container_help_test:
    docker:
    - image: docker:stable
    steps:
      - setup-docker
      - run:
          name: Docker container help test
          shell: /bin/sh
          command: |
            docker rmi quay.io/redhat/3scale-toolbox:main || true
            docker run --rm -t quay.io/redhat/3scale-toolbox:main 3scale help

  complete-coverage:
    docker:
      - image: cimg/ruby:3.0
    working_directory: ~/repo
    steps:
      - checkout
      - install-qlty
      - run:
          name: Mark coverage as complete
          command: |
            ~/.qlty/bin/qlty coverage complete --tag unit
            ~/.qlty/bin/qlty coverage complete --tag integration

  push-rubygems:
    docker:
      - image: cimg/ruby:3.0
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Setup Rubygems
          command: bash .circleci/setup-rubygems.sh
      - run:
          name: Publish to Rubygems
          command: |
            gem build 3scale_toolbox.gemspec -o "3scale_toolbox-$(git describe --tags).gem"
            gem push "3scale_toolbox-$(git describe --tags).gem"
  image-build:
    docker:
      - image: docker:stable
    working_directory: /app
    steps:
      - setup-docker
      - checkout
      - run:
          name: Build application Docker image
          command: |
            docker build -t app .
      - run:
          name: Run container smoke tests
          command: |
            docker run --rm -t app 3scale help

workflows:
  pr:
    when:
      not:
        equal: [ main, << pipeline.git.branch >> ]
    jobs:
      - manual_approval:
          type: approval
      - ruby-30-unittest:
          requires:
            - manual_approval
          filters:
            <<: *tag-trigger
      - license_check:
          requires:
            - manual_approval
          filters:
            <<: *tag-trigger
      - help_test:
          requires:
            - manual_approval
          filters:
            <<: *tag-trigger
      - image-build:
          requires:
            - manual_approval
          filters:
            <<: *tag-trigger
      - integration_tests:
          context: autotestaccount
          requires:
            - manual_approval
      - complete-coverage:
          requires:
            - ruby-30-unittest
            - integration_tests

  main:
    when:
      equal: [ main, << pipeline.git.branch >> ]
    jobs:
      - ruby-30-unittest:
          filters:
            <<: *tag-trigger
      - license_check:
          filters:
            <<: *tag-trigger
      - help_test:
          filters:
            <<: *tag-trigger
      - image-build:
          filters:
            <<: *tag-trigger
      - integration_tests:
          context: autotestaccount
      - complete-coverage:
          requires:
            - ruby-30-unittest
            - integration_tests
      - push-rubygems:
          requires:
            - ruby-30-unittest
            - license_check
            - help_test
          filters:
            <<: *tag-trigger
            branches:
              ignore: /.*/
